# --- headless service so Prometheus can find EVERY processor pod ---
apiVersion: v1
kind: Service
metadata:
  name: processor-metrics
  namespace: trends
spec:
  clusterIP: None            # headless: DNS returns all pod IPs, not one
  selector: { app: processor }
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
---
# --- Prometheus config ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: trends
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: processor
        dns_sd_configs:
          - names: ["processor-metrics.trends.svc.cluster.local"]
            type: A
            port: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: trends
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: trends
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
---
# --- Grafana, pre-connected to Prometheus ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: trends
data:
  ds.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: trends
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: trends
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000